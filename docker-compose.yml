services:
  db:
    image: postgres:16-alpine
    container_name: auditsaas-db
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: auditsaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d auditsaas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
